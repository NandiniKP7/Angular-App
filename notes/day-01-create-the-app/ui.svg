<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560"><title>Day 1: LearnBuddy landing screen</title><desc>The landing page built on Day 1: a dark teal full-width band, the title LearnBuddy, the tagline Learn, Practice, Improve, and a small amber label showing the starter state of the app.</desc><rect x="0" y="0" width="1280" height="560" rx="0" fill="#0e3441" /><text x="640" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">❖ LearnBuddy</text><text x="640" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="normal" fill="#bcd6da" text-anchor="middle">Learn · Practice · Improve</text><rect x="560" y="330" width="147" height="20" rx="4" fill="#f0a500" /><text x="567" y="344" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#10243a" text-anchor="start">app.html · .landing</text><rect x="560" y="360" width="126" height="20" rx="4" fill="#f0a500" /><text x="567" y="374" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#10243a" text-anchor="start">h1 + p, centered</text></svg>