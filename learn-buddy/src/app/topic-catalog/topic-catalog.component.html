<section class="card">
  <h3>Angular Roadmap</h3>
  @if (filter === 'all') {
    <p class="sub">{{ topics.length }} of 44 topics shown</p>
  } @else {
    <p class="sub">{{ visibleTopics().length }} topics match this filter</p>
  }

  <div class="chips">
    <button class="chip" [class.on]="filter === 'all'" (click)="setFilter('all')">All</button>
    <button class="chip" [class.on]="filter === 'done'" (click)="setFilter('done')">
      Completed
    </button>
    <button class="chip" [class.on]="filter === 'in-progress'" (click)="setFilter('in-progress')">
      In progress
    </button>
    <button class="chip" [class.on]="filter === 'not-started'" (click)="setFilter('not-started')">
      Not started
    </button>
  </div>

  <div class="actions">
    <button (click)="clear()">Clear list</button>
    <button (click)="restore()">Restore list</button>
  </div>

  <div class="cards">
    @for (topic of visibleTopics(); track topic.no; let last=$last, odd=$odd) {
      <app-topic-card [no]="+topic.no" [title]="topic.title" [status]="topic.status" />
    }
     @empty {
    <p class="empty">No topics to show.</p>
  }
  </div>
</section>
