<div class="tracks">
  <section class="track angular">
    <img [src]="angularIcon" [alt]="angularName" [width]="iconSize" [height]="iconSize" />
    <h3>{{ angularName }}</h3>
    <p>Concept-first lessons</p>
    <span class="status">{{ angularStatus }}</span>
    <div class="bar" [attr.aria-label]="'Angular progress ' + angularPercent + ' percent'">
      <div class="bar-fill" [style.width.%]="angularPercent"></div>
    </div>
    <button [title]="angularHint">View topics</button>
  </section>
  <section class="track typescript">
    <img [src]="typescriptIcon" [alt]="typescriptName" [width]="iconSize" [height]="iconSize" />
    <h3>{{ typescriptName }}</h3>
    <p>Follow existing roadmap</p>
    <span class="status">{{typescriptStatus}}</span>
    <div class="bar"  [attr.aria-label]="'TypeScript progress ' + typescriptPercent + ' percent'">
      <div class="bar-fill" [style.width.%]="typescriptPercent"></div>
    </div>
    <button [title]="typescriptHint">View topics</button>
  </section>
  <section class="track csharp">
    <img [src]="csharpIcon" [alt]="csharpName" [width]="iconSize" [height]="iconSize" />
    <h3>{{ csharpName }}</h3>
    <p>Future learning track, planned for later in the course.</p>
    <span class="status">{{csharpStatus}}</span>
    <div class="bar" role="progressbar" aria-valuemin="0"  aria-valuemax="100" [attr.aria-label]="'csharp progress ' + 0 + ' percent'">
      <div class="bar-fill" [style.width.%]="0"></div>
    </div>
    <button [disabled]="csharpLocked" [title]="csharpHint">View topics</button>
  </section>
</div>
